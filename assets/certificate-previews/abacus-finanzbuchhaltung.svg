  <rect width="1200" height="760" fill="#f7f5f0"/>
  <rect x="44" y="44" width="1112" height="672" rx="26" fill="#fffdf8" stroke="#ded7ca" stroke-width="4"/>
  <circle cx="1020" cy="150" r="42" fill="#e74d60" opacity="0.9"/>
