name: Update contribution SVG

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        # actions/setup-node v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Generate contribution SVG
        run: node scripts/generate-contribution-graphic.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: AleksZyro

      - name: Commit updated contribution data
        run: |
          if git diff --quiet -- assets/contribution-graphic.svg index.html; then
            echo "No contribution data changes."
            exit 0
          fi

          git config user.name "AleksZyro"
          git config user.email "178569539+AleksZyro@users.noreply.github.com"
          git add assets/contribution-graphic.svg index.html
          git commit -m "Update contribution graphic and streak"
          git push
