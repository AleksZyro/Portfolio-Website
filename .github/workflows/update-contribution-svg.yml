name: Update contribution SVG

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate contribution SVG
        run: node scripts/generate-contribution-graphic.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: AleksZyro

      - name: Commit updated SVG
        run: |
          if git diff --quiet -- assets/contribution-graphic.svg; then
            echo "No contribution SVG changes."
            exit 0
          fi

          git config user.name "AleksZyro"
          git config user.email "A.Nikolic.inf24@stud.bbbaden.ch"
          git add assets/contribution-graphic.svg
          git commit -m "Update contribution graphic"
          git push
