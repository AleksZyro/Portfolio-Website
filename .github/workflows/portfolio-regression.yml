name: Portfolio regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run portfolio regression tests
        run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check GitHub streak calculation
        run: node --test tests/contribution-streaks.test.mjs
      - name: Check portfolio in real browser viewports
        run: npm run test:browser
      - name: Keep screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
